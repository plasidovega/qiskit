name: T3 Benchmark V6 - Robust Qiskit Capability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t3-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
      IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          pip install \
            qiskit \
            qiskit-aer \
            qiskit-ibm-runtime \
            networkx \
            numpy \
            scipy \
            pandas

      - name: Run V6 benchmark
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v6.py <<'PY'
          import os
          import json
          import time
          import random
          import statistics
          import platform

          import numpy as np
          import pandas as pd
          import networkx as nx

          import qiskit
          from qiskit import QuantumCircuit
          from qiskit.transpiler import generate_preset_pass_manager
          from qiskit_aer import AerSimulator

          SEED = 20260915
          random.seed(SEED)
          np.random.seed(SEED)

          rows = []
          report = {
              "benchmark": "T3 V6",
              "seed": SEED,
              "python": platform.python_version(),
              "qiskit": qiskit.__version__,
              "t3": {},
              "aer": [],
              "ibm": {}
          }


          # ============================================================
          # T3
          # Terrain  = dynamic edge costs
          # Topology = graph
          # Trail    = source-to-destination path
          # ============================================================

          def make_graph(n, seed):
              rng = np.random.default_rng(seed)

              G = nx.connected_watts_strogatz_graph(
                  n=n,
                  k=6,
                  p=0.15,
                  seed=seed
              )

              for u, v in G.edges:
                  G[u][v]["weight"] = float(
                      rng.uniform(1.0, 20.0)
                  )

              return G


          def path_cost(G, path):
              return sum(
                  G[u][v]["weight"]
                  for u, v in zip(path[:-1], path[1:])
              )


          def global_solution(G, source, target):
              start = time.perf_counter()

              path = nx.shortest_path(
                  G,
                  source,
                  target,
                  weight="weight"
              )

              elapsed = time.perf_counter() - start

              return path, path_cost(G, path), elapsed


          def frontier(G, seeds, radius):
              nodes = set(seeds)
              edge = set(seeds)

              for _ in range(radius):
                  nxt = set()

                  for u in edge:
                      nxt.update(G.neighbors(u))

                  nxt -= nodes
                  nodes |= nxt
                  edge = nxt

                  if not edge:
                      break

              return nodes


          def valid_path(G, path):
              if len(path) != len(set(path)):
                  return False

              return all(
                  G.has_edge(u, v)
                  for u, v in zip(path[:-1], path[1:])
              )


          def adaptive_repair(
              G,
              old_path,
              changed_nodes,
              optimal_cost,
              epsilon=0.02,
              max_radius=8
          ):
              start = time.perf_counter()
              best = None

              for radius in range(max_radius + 1):
                  F = frontier(
                      G,
                      changed_nodes,
                      radius
                  )

                  positions = [
                      i for i, node in enumerate(old_path)
                      if node in F
                  ]

                  if not positions:
                      continue

                  left = max(
                      0,
                      min(positions) - 1
                  )

                  right = min(
                      len(old_path) - 1,
                      max(positions) + 1
                  )

                  a = old_path[left]
                  b = old_path[right]

                  local_nodes = F | {a, b}
                  H = G.subgraph(local_nodes)

                  try:
                      replacement = nx.shortest_path(
                          H,
                          a,
                          b,
                          weight="weight"
                      )
                  except nx.NetworkXNoPath:
                      continue

                  candidate = (
                      old_path[:left]
                      + replacement
                      + old_path[right + 1:]
                  )

                  if not valid_path(G, candidate):
                      continue

                  c = path_cost(G, candidate)
                  ratio = c / optimal_cost

                  old_edges = set(
                      zip(old_path[:-1], old_path[1:])
                  )

                  new_edges = set(
                      zip(candidate[:-1], candidate[1:])
                  )

                  disruption = len(
                      old_edges.symmetric_difference(new_edges)
                  )

                  result = {
                      "success": ratio <= 1.0 + epsilon,
                      "path": candidate,
                      "cost": c,
                      "quality_ratio": ratio,
                      "frontier": len(F),
                      "radius": radius,
                      "disruption": disruption,
                      "time": time.perf_counter() - start
                  }

                  if best is None or ratio < best["quality_ratio"]:
                      best = result

                  if result["success"]:
                      return result

              if best:
                  best["success"] = False
                  return best

              return {
                  "success": False,
                  "time": time.perf_counter() - start
              }


          # ============================================================
          # E1 — SCALING
          # ============================================================

          print("\n=== E1 T3 SCALING ===", flush=True)

          scaling = []

          for n in [128, 256, 512, 1024, 2048, 4096]:

              G = make_graph(
                  n,
                  SEED + n
              )

              source = 0
              target = n - 1

              old_path, old_cost, _ = global_solution(
                  G,
                  source,
                  target
              )

              if len(old_path) < 2:
                  continue

              i = (len(old_path) - 1) // 2
              u, v = old_path[i], old_path[i + 1]

              G[u][v]["weight"] *= 20.0

              new_path, optimum, global_time = global_solution(
                  G,
                  source,
                  target
              )

              repair = adaptive_repair(
                  G,
                  old_path,
                  {u, v},
                  optimum
              )

              reduction = None

              if repair.get("frontier"):
                  reduction = (
                      1.0 -
                      repair["frontier"] / n
                  )

              result = {
                  "nodes": n,
                  "global_cost": optimum,
                  "global_time": global_time,
                  "repair_success":
                      repair["success"],
                  "t3_cost":
                      repair.get("cost"),
                  "quality_ratio":
                      repair.get("quality_ratio"),
                  "frontier":
                      repair.get("frontier"),
                  "radius":
                      repair.get("radius"),
                  "disruption":
                      repair.get("disruption"),
                  "t3_time":
                      repair.get("time"),
                  "recompute_reduction":
                      reduction
              }

              scaling.append(result)

              rows.append({
                  "experiment": "scaling",
                  **result
              })

              print(result, flush=True)

          report["t3"]["scaling"] = scaling


          # ============================================================
          # E2 — 250 REPEATED TERRAIN CHANGES
          # ============================================================

          print(
              "\n=== E2 250 TERRAIN PERTURBATIONS ===",
              flush=True
          )

          G = make_graph(
              1024,
              SEED + 9000
          )

          trials = 250
          successes = 0
          ratios = []
          reductions = []
          disruptions = []

          for trial in range(trials):

              old_path, _, _ = global_solution(
                  G,
                  0,
                  1023
              )

              if len(old_path) < 2:
                  continue

              i = random.randrange(
                  len(old_path) - 1
              )

              u, v = old_path[i], old_path[i + 1]

              original = G[u][v]["weight"]

              G[u][v]["weight"] *= random.uniform(
                  1.25,
                  20.0
              )

              _, optimum, _ = global_solution(
                  G,
                  0,
                  1023
              )

              repair = adaptive_repair(
                  G,
                  old_path,
                  {u, v},
                  optimum
              )

              if repair["success"]:
                  successes += 1

                  ratios.append(
                      repair["quality_ratio"]
                  )

                  reductions.append(
                      1 -
                      repair["frontier"] / len(G)
                  )

                  disruptions.append(
                      repair["disruption"]
                  )

              G[u][v]["weight"] = original

              if (trial + 1) % 25 == 0:
                  print(
                      "completed",
                      trial + 1,
                      "/",
                      trials,
                      flush=True
                  )

          success_rate = successes / trials

          mean_quality = (
              statistics.mean(ratios)
              if ratios else None
          )

          mean_reduction = (
              statistics.mean(reductions)
              if reductions else None
          )

          perturbation_summary = {
              "trials": trials,
              "successes": successes,
              "success_rate": success_rate,
              "mean_quality_ratio": mean_quality,
              "mean_recompute_reduction":
                  mean_reduction,
              "mean_disruption":
                  statistics.mean(disruptions)
                  if disruptions else None
          }

          report["t3"]["perturbations"] = (
              perturbation_summary
          )

          rows.append({
              "experiment":
                  "terrain_perturbations",
              **perturbation_summary
          })

          print(
              perturbation_summary,
              flush=True
          )


          # ============================================================
          # E3 — TOPOLOGY FAILURE
          # ============================================================

          print(
              "\n=== E3 TOPOLOGY FAILURE ===",
              flush=True
          )

          G = make_graph(
              1024,
              SEED + 10000
          )

          old_path, _, _ = global_solution(
              G,
              0,
              1023
          )

          topology_result = {
              "attempted": False
          }

          if len(old_path) >= 2:

              i = (len(old_path) - 1) // 2
              u, v = old_path[i], old_path[i + 1]

              attributes = dict(G[u][v])

              G.remove_edge(u, v)

              try:
                  _, optimum, global_time = global_solution(
                      G,
                      0,
                      1023
                  )

                  repair = adaptive_repair(
                      G,
                      old_path,
                      {u, v},
                      optimum
                  )

                  topology_result = {
                      "attempted": True,
                      "repair_success":
                          repair["success"],
                      "global_cost":
                          optimum,
                      "global_time":
                          global_time,
                      "t3_cost":
                          repair.get("cost"),
                      "quality_ratio":
                          repair.get("quality_ratio"),
                      "frontier":
                          repair.get("frontier"),
                      "radius":
                          repair.get("radius"),
                      "disruption":
                          repair.get("disruption")
                  }

              except Exception as exc:
                  topology_result = {
                      "attempted": True,
                      "error": repr(exc)
                  }

              finally:
                  G.add_edge(
                      u,
                      v,
                      **attributes
                  )

          report["t3"]["topology_failure"] = (
              topology_result
          )

          rows.append({
              "experiment":
                  "topology_failure",
              **topology_result
          })

          print(
              topology_result,
              flush=True
          )


          # ============================================================
          # E4 — QISKIT AER
          # ============================================================

          print(
              "\n=== E4 QISKIT AER ===",
              flush=True
          )

          for qubits in [5, 10, 15, 20]:

              qc = QuantumCircuit(qubits)

              qc.h(0)

              for q in range(qubits - 1):
                  qc.cx(q, q + 1)

              qc.measure_all()

              simulator = AerSimulator()

              start = time.perf_counter()

              result = simulator.run(
                  qc,
                  shots=4096
              ).result()

              elapsed = (
                  time.perf_counter() - start
              )

              counts = result.get_counts()

              good = (
                  counts.get(
                      "0" * qubits,
                      0
                  )
                  +
                  counts.get(
                      "1" * qubits,
                      0
                  )
              )

              aer_result = {
                  "qubits": qubits,
                  "shots": 4096,
                  "runtime": elapsed,
                  "ghz_success":
                      good / 4096
              }

              report["aer"].append(
                  aer_result
              )

              print(
                  aer_result,
                  flush=True
              )


          # ============================================================
          # SAVE CLASSICAL/AER RESULTS BEFORE IBM
          # ============================================================

          pd.DataFrame(rows).to_csv(
              "t3_v6_results.csv",
              index=False
          )

          with open(
              "t3_v6_results.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  default=str
              )


          # ============================================================
          # E5 — IBM BACKEND DISCOVERY
          #
          # IBM failure MUST NOT destroy T3 results.
          # ============================================================

          print(
              "\n=== E5 IBM QUANTUM ===",
              flush=True
          )

          token = os.getenv(
              "IBM_QUANTUM_TOKEN",
              ""
          ).strip()

          instance = os.getenv(
              "IBM_QUANTUM_INSTANCE",
              ""
          ).strip()

          ibm = {
              "token_present": bool(token),
              "qpu_attempted": False,
              "qpu_completed": False
          }

          if not token:

              ibm["status"] = (
                  "No IBM token available; "
                  "hardware test skipped."
              )

              print(
                  ibm["status"],
                  flush=True
              )

          else:

              try:
                  from qiskit_ibm_runtime import (
                      QiskitRuntimeService,
                      SamplerV2
                  )

                  kwargs = {
                      "channel":
                          "ibm_quantum_platform",
                      "token":
                          token
                  }

                  if instance:
                      kwargs["instance"] = instance

                  service = QiskitRuntimeService(
                      **kwargs
                  )

                  # IMPORTANT:
                  # Do not use least_busy(min_num_qubits=...).
                  # First inspect what THIS account can access.

                  available = service.backends()

                  backend_info = []

                  for backend in available:

                      try:
                          operational = (
                              backend.status().operational
                          )
                      except Exception:
                          operational = None

                      backend_info.append({
                          "name":
                              backend.name,
                          "qubits":
                              getattr(
                                  backend,
                                  "num_qubits",
                                  None
                              ),
                          "operational":
                              operational
                      })

                  ibm["available_backends"] = (
                      backend_info
                  )

                  print(
                      "Accessible backends:",
                      backend_info,
                      flush=True
                  )

                  candidates = []

                  for backend in available:

                      try:
                          if (
                              backend.status().operational
                              and
                              not getattr(
                                  backend.configuration(),
                                  "simulator",
                                  False
                              )
                          ):
                              candidates.append(
                                  backend
                              )

                      except Exception:
                          # Modern backend may not expose
                          # configuration in exactly the same way.
                          try:
                              if backend.status().operational:
                                  candidates.append(
                                      backend
                                  )
                          except Exception:
                              pass

                  if not candidates:

                      ibm["status"] = (
                          "Authentication succeeded, "
                          "but no operational QPU "
                          "is currently accessible."
                      )

                      print(
                          ibm["status"],
                          flush=True
                      )

                  else:

                      # Prefer shortest queue if status
                      # exposes pending_jobs.

                      def queue_key(backend):
                          try:
                              return (
                                  backend.status().pending_jobs
                              )
                          except Exception:
                              return 10**9

                      candidates.sort(
                          key=queue_key
                      )

                      backend = candidates[0]

                      ibm["selected_backend"] = (
                          backend.name
                      )

                      ibm["selected_qubits"] = (
                          getattr(
                              backend,
                              "num_qubits",
                              None
                          )
                      )

                      ibm["pending_jobs"] = (
                          queue_key(backend)
                      )

                      print(
                          "Selected:",
                          backend.name,
                          "qubits:",
                          ibm["selected_qubits"],
                          "pending:",
                          ibm["pending_jobs"],
                          flush=True
                      )

                      # Small control workload deliberately used
                      # so queue/runtime does not dominate V6.

                      nq = min(
                          5,
                          int(
                              ibm["selected_qubits"]
                              or 5
                          )
                      )

                      qc = QuantumCircuit(nq)

                      qc.h(0)

                      for q in range(nq - 1):
                          qc.cx(q, q + 1)

                      qc.measure_all()

                      pm = (
                          generate_preset_pass_manager(
                              backend=backend,
                              optimization_level=3
                          )
                      )

                      isa = pm.run(qc)

                      sampler = SamplerV2(
                          mode=backend
                      )

                      ibm["qpu_attempted"] = True

                      job = sampler.run(
                          [isa],
                          shots=256
                      )

                      ibm["job_id"] = (
                          job.job_id()
                      )

                      print(
                          "IBM job submitted:",
                          ibm["job_id"],
                          flush=True
                      )

                      # Poll explicitly so V6 does not wait
                      # indefinitely for IBM queue.

                      deadline = (
                          time.time() + 600
                      )

                      terminal = {
                          "DONE",
                          "ERROR",
                          "CANCELLED"
                      }

                      while time.time() < deadline:

                          status = job.status()

                          status_name = (
                              getattr(
                                  status,
                                  "name",
                                  str(status)
                              )
                          )

                          print(
                              "IBM job status:",
                              status_name,
                              flush=True
                          )

                          if status_name in terminal:
                              break

                          time.sleep(20)

                      status = job.status()

                      status_name = (
                          getattr(
                              status,
                              "name",
                              str(status)
                          )
                      )

                      ibm["final_status"] = (
                          status_name
                      )

                      if status_name == "DONE":

                          qresult = (
                              job.result()[0]
                          )

                          counts = (
                              qresult
                              .data
                              .meas
                              .get_counts()
                          )

                          good = (
                              counts.get(
                                  "0" * nq,
                                  0
                              )
                              +
                              counts.get(
                                  "1" * nq,
                                  0
                              )
                          )

                          total = sum(
                              counts.values()
                          )

                          ibm["counts"] = counts
                          ibm["ghz_success"] = (
                              good / total
                              if total else None
                          )

                          ibm["qpu_completed"] = True

                          print(
                              "QPU GHZ success:",
                              ibm["ghz_success"],
                              flush=True
                          )

                      else:

                          ibm["status"] = (
                              "QPU job did not complete "
                              "inside V6's 10-minute "
                              "queue guard. Job ID was "
                              "preserved."
                          )

                          print(
                              ibm["status"],
                              flush=True
                          )

              except Exception as exc:

                  ibm["status"] = (
                      "IBM section failed gracefully."
                  )

                  ibm["error"] = repr(exc)

                  print(
                      "IBM warning:",
                      repr(exc),
                      flush=True
                  )


          # ============================================================
          # FINAL VERDICT
          # ============================================================

          report["ibm"] = ibm

          t3_supported = (
              success_rate >= 0.90
              and
              mean_quality is not None
              and
              mean_quality <= 1.02
              and
              mean_reduction is not None
              and
              mean_reduction >= 0.50
          )

          report["t3"]["verdict"] = {
              "supported":
                  t3_supported,
              "success_rate":
                  success_rate,
              "mean_quality_ratio":
                  mean_quality,
              "mean_recompute_reduction":
                  mean_reduction,
              "criteria": {
                  "success_rate":
                      ">= 0.90",
                  "quality_ratio":
                      "<= 1.02",
                  "recompute_reduction":
                      ">= 0.50"
              }
          }

          report["qiskit_capability"] = {
              "aer_completed":
                  len(report["aer"]) == 4,
              "ibm_authenticated":
                  bool(
                      ibm.get(
                          "available_backends"
                      )
                  ),
              "qpu_attempted":
                  ibm.get(
                      "qpu_attempted",
                      False
                  ),
              "qpu_completed":
                  ibm.get(
                      "qpu_completed",
                      False
                  )
          }

          with open(
              "t3_v6_results.json",
              "w"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  default=str
              )

          print(
              "\n=== V6 FINAL ===",
              flush=True
          )

          print(
              "T3 hypothesis supported:",
              t3_supported,
              flush=True
          )

          print(
              "IBM:",
              ibm.get(
                  "status",
                  "completed"
              ),
              flush=True
          )

          print(
              "V6_COMPLETE",
              flush=True
          )

          PY

          python -u /tmp/v6.py

          test -s t3_v6_results.json
          test -s t3_v6_results.csv

          grep -q '"verdict"' t3_v6_results.json

          echo "V6 benchmark outputs validated."

      - name: Show V6 summary
        if: always()
        run: |
          echo "=== Files ==="
          ls -lh t3_v6_results.* 2>/dev/null || true

          echo "=== JSON summary ==="
          if [ -f t3_v6_results.json ]; then
            python - <<'PY'
          import json

          with open("t3_v6_results.json") as f:
              r = json.load(f)

          print("T3 verdict:")
          print(
              json.dumps(
                  r.get("t3", {}).get("verdict", {}),
                  indent=2
              )
          )

          print("Qiskit capability:")
          print(
              json.dumps(
                  r.get("qiskit_capability", {}),
                  indent=2
              )
          )

          print("IBM:")
          print(
              json.dumps(
                  r.get("ibm", {}),
                  indent=2
              )
          )
          PY
          fi

      - name: Upload V6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-v6-results
          path: |
            t3_v6_results.csv
            t3_v6_results.json
          if-no-files-found: warn
          retention-days: 30
