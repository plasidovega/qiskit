name: T3 Benchmark V6 - Qiskit Maximum Capability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6.yml"
  workflow_dispatch:
    inputs:
      enable_pec:
        description: "Enable bounded PEC experiment"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  t3-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
      IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
      ENABLE_PEC: ${{ inputs.enable_pec || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qiskit research stack
        run: |
          python -m pip install --upgrade pip
          pip install \
            "qiskit[all]>=2.5.2" \
            "qiskit-ibm-runtime>=0.47" \
            qiskit-aer \
            qiskit-algorithms \
            qiskit-optimization \
            networkx \
            numpy \
            scipy \
            pandas

      - name: Run V6
        run: |
          cat > /tmp/v6.py <<'PY'
          import os
          import json
          import time
          import random
          import statistics

          import numpy as np
          import pandas as pd
          import networkx as nx

          from qiskit import QuantumCircuit
          from qiskit.quantum_info import SparsePauliOp
          from qiskit.transpiler import generate_preset_pass_manager
          from qiskit_aer import AerSimulator
          from qiskit_ibm_runtime import (
              QiskitRuntimeService,
              SamplerV2,
              EstimatorV2
          )

          SEED = 20260915
          random.seed(SEED)
          np.random.seed(SEED)

          ENABLE_PEC = (
              os.getenv("ENABLE_PEC", "false").lower() == "true"
          )

          rows = []
          raw = {}

          # ==========================================================
          # T3 MODEL
          # Terrain  = edge weights / failures / penalties
          # Topology = graph
          # Trail    = current source -> target solution
          # ==========================================================

          def make_graph(n, seed):
              rng = np.random.default_rng(seed)

              G = nx.connected_watts_strogatz_graph(
                  n=n,
                  k=min(6, n - 1),
                  p=0.15,
                  seed=seed
              )

              for u, v in G.edges:
                  G[u][v]["weight"] = float(
                      rng.uniform(1, 20)
                  )

              return G


          def cost(G, path):
              return sum(
                  G[u][v]["weight"]
                  for u, v in zip(path[:-1], path[1:])
              )


          def solve_global(G, s, t):
              start = time.perf_counter()

              p = nx.shortest_path(
                  G, s, t, weight="weight"
              )

              return {
                  "path": p,
                  "cost": cost(G, p),
                  "time": time.perf_counter() - start,
                  "nodes_examined_proxy": len(G)
              }


          def expand_frontier(G, initial, radius):
              frontier = set(initial)

              for _ in range(radius):
                  frontier |= {
                      x
                      for n in tuple(frontier)
                      for x in G.neighbors(n)
                  }

              return frontier


          def adaptive_t3(
              G,
              old_path,
              changed_nodes,
              global_cost,
              epsilon=0.02
          ):
              start = time.perf_counter()

              max_radius = min(
                  nx.diameter(G),
                  12
              )

              curve = []

              for radius in range(max_radius + 1):

                  frontier = expand_frontier(
                      G,
                      changed_nodes,
                      radius
                  )

                  positions = [
                      i for i, n in enumerate(old_path)
                      if n in frontier
                  ]

                  if not positions:
                      continue

                  li = max(0, min(positions) - 1)
                  ri = min(
                      len(old_path) - 1,
                      max(positions) + 1
                  )

                  a = old_path[li]
                  b = old_path[ri]

                  local_nodes = set(frontier)
                  local_nodes.update([a, b])

                  H = G.subgraph(local_nodes)

                  try:
                      local = nx.shortest_path(
                          H,
                          a,
                          b,
                          weight="weight"
                      )
                  except nx.NetworkXNoPath:
                      continue

                  candidate = (
                      old_path[:li]
                      + local
                      + old_path[ri + 1:]
                  )

                  cleaned = []

                  for n in candidate:
                      if not cleaned or cleaned[-1] != n:
                          cleaned.append(n)

                  try:
                      c = cost(G, cleaned)
                  except Exception:
                      continue

                  old_edges = set(
                      zip(old_path[:-1], old_path[1:])
                  )

                  new_edges = set(
                      zip(cleaned[:-1], cleaned[1:])
                  )

                  disruption = len(
                      old_edges.symmetric_difference(new_edges)
                  )

                  ratio = c / global_cost

                  curve.append({
                      "radius": radius,
                      "frontier": len(frontier),
                      "fraction": len(frontier) / len(G),
                      "cost": c,
                      "quality_ratio": ratio,
                      "disruption": disruption
                  })

                  if ratio <= 1 + epsilon:
                      return {
                          "success": True,
                          "path": cleaned,
                          "cost": c,
                          "quality_ratio": ratio,
                          "frontier": len(frontier),
                          "radius": radius,
                          "disruption": disruption,
                          "time": time.perf_counter() - start,
                          "curve": curve
                      }

              return {
                  "success": False,
                  "time": time.perf_counter() - start,
                  "curve": curve
              }


          # ==========================================================
          # E1: LARGE SCALE T3
          # ==========================================================

          print("\n=== E1 LARGE-SCALE T3 ===")

          graph_sizes = [
              128,
              256,
              512,
              1024,
              2048,
              4096
          ]

          for n in graph_sizes:

              G = make_graph(n, SEED + n)

              s, t = 0, n - 1

              baseline = solve_global(G, s, t)

              path = baseline["path"]

              if len(path) < 2:
                  continue

              middle = (len(path) - 1) // 2
              u, v = path[middle], path[middle + 1]

              original = G[u][v]["weight"]

              # Severe Terrain disturbance.
              G[u][v]["weight"] *= 20

              global_new = solve_global(G, s, t)

              repair = adaptive_t3(
                  G,
                  path,
                  {u, v},
                  global_new["cost"]
              )

              if repair["success"]:

                  reduction = (
                      1 - repair["frontier"] / n
                  )

                  print(
                      n,
                      "quality=",
                      repair["quality_ratio"],
                      "frontier=",
                      repair["frontier"],
                      "reduction=",
                      reduction
                  )

                  rows.append({
                      "experiment": "scaling",
                      "nodes": n,
                      "global_cost": global_new["cost"],
                      "t3_cost": repair["cost"],
                      "quality_ratio":
                          repair["quality_ratio"],
                      "frontier":
                          repair["frontier"],
                      "recompute_reduction":
                          reduction,
                      "radius":
                          repair["radius"],
                      "disruption":
                          repair["disruption"],
                      "global_time":
                          global_new["time"],
                      "t3_time":
                          repair["time"]
                  })


          # ==========================================================
          # E2: 1000 DYNAMIC TERRAIN PERTURBATIONS
          # ==========================================================

          print("\n=== E2 1000 PERTURBATIONS ===")

          G = make_graph(1024, SEED + 999)

          successes = 0
          ratios = []
          reductions = []
          disruptions = []

          for trial in range(1000):

              baseline = solve_global(
                  G, 0, len(G) - 1
              )

              p = baseline["path"]

              if len(p) < 2:
                  continue

              i = random.randrange(len(p) - 1)

              u, v = p[i], p[i + 1]

              original = G[u][v]["weight"]

              G[u][v]["weight"] *= random.uniform(
                  1.25, 25
              )

              global_new = solve_global(
                  G, 0, len(G) - 1
              )

              repair = adaptive_t3(
                  G,
                  p,
                  {u, v},
                  global_new["cost"]
              )

              if repair["success"]:
                  successes += 1

                  ratios.append(
                      repair["quality_ratio"]
                  )

                  reductions.append(
                      1 - repair["frontier"] / len(G)
                  )

                  disruptions.append(
                      repair["disruption"]
                  )

              G[u][v]["weight"] = original


          success_rate = successes / 1000

          mean_ratio = (
              statistics.mean(ratios)
              if ratios else float("nan")
          )

          mean_reduction = (
              statistics.mean(reductions)
              if reductions else 0
          )

          print("success:", success_rate)
          print("quality:", mean_ratio)
          print("reduction:", mean_reduction)

          rows.append({
              "experiment": "1000_perturbations",
              "nodes": 1024,
              "success_rate": success_rate,
              "quality_ratio": mean_ratio,
              "recompute_reduction":
                  mean_reduction,
              "mean_disruption":
                  statistics.mean(disruptions)
                  if disruptions else None
          })


          # ==========================================================
          # E3: TOPOLOGY FAILURE
          # ==========================================================

          print("\n=== E3 TOPOLOGY FAILURE ===")

          G = make_graph(1024, SEED + 555)

          baseline = solve_global(
              G, 0, len(G) - 1
          )

          p = baseline["path"]

          if len(p) > 2:

              i = (len(p) - 1) // 2
              u, v = p[i], p[i + 1]

              attr = dict(G[u][v])

              G.remove_edge(u, v)

              full = solve_global(
                  G, 0, len(G) - 1
              )

              repair = adaptive_t3(
                  G,
                  p,
                  {u, v},
                  full["cost"]
              )

              rows.append({
                  "experiment":
                      "topology_failure",
                  "nodes": 1024,
                  "success":
                      repair["success"],
                  "global_cost":
                      full["cost"],
                  "t3_cost":
                      repair.get("cost"),
                  "quality_ratio":
                      repair.get("quality_ratio"),
                  "frontier":
                      repair.get("frontier"),
                  "radius":
                      repair.get("radius"),
                  "disruption":
                      repair.get("disruption")
              })

              G.add_edge(u, v, **attr)


          # ==========================================================
          # E4: QISKIT AER COMPUTE
          # ==========================================================

          print("\n=== E4 AER ===")

          aer_rows = []

          for qubits in [5, 8, 10, 12, 14]:

              qc = QuantumCircuit(qubits)

              qc.h(0)

              for q in range(qubits - 1):
                  qc.cx(q, q + 1)

              qc.measure_all()

              sim = AerSimulator()

              start = time.perf_counter()

              result = sim.run(
                  qc,
                  shots=8192
              ).result()

              runtime = time.perf_counter() - start

              counts = result.get_counts()

              good = (
                  counts.get("0" * qubits, 0)
                  + counts.get("1" * qubits, 0)
              )

              success = good / 8192

              aer_rows.append({
                  "qubits": qubits,
                  "runtime": runtime,
                  "ghz_success": success
              })

              print(
                  qubits,
                  runtime,
                  success
              )

          raw["aer"] = aer_rows


          # ==========================================================
          # E5-E8 IBM QPU CAPABILITY
          # ==========================================================

          print("\n=== IBM QUANTUM ===")

          token = os.getenv(
              "IBM_QUANTUM_TOKEN", ""
          ).strip()

          instance = os.getenv(
              "IBM_QUANTUM_INSTANCE", ""
          ).strip()

          ibm = {}

          if token:

              kwargs = {
                  "channel":
                      "ibm_quantum_platform",
                  "token":
                      token
              }

              if instance:
                  kwargs["instance"] = instance

              service = QiskitRuntimeService(**kwargs)

              backends = service.backends(
                  operational=True,
                  simulator=False
              )

              ibm["available_backends"] = [
                  {
                      "name": b.name,
                      "qubits": b.num_qubits
                  }
                  for b in backends
              ]

              backend = service.least_busy(
                  operational=True,
                  simulator=False,
                  min_num_qubits=10
              )

              print(
                  "backend:",
                  backend.name,
                  backend.num_qubits
              )

              ibm["selected_backend"] = backend.name
              ibm["selected_qubits"] = backend.num_qubits


              # ------------------------------------------------------
              # Hardware workload
              # ------------------------------------------------------

              nq = 10

              qc = QuantumCircuit(nq)

              qc.h(0)

              for q in range(nq - 1):
                  qc.cx(q, q + 1)

              qc.measure_all()

              pm = generate_preset_pass_manager(
                  backend=backend,
                  optimization_level=3
              )

              isa = pm.run(qc)

              sampler = SamplerV2(
                  mode=backend
              )

              sampler.options.dynamical_decoupling.enable = True
              sampler.options.dynamical_decoupling.sequence_type = "XpXm"

              sampler.options.twirling.enable_gates = True
              sampler.options.twirling.num_randomizations = 64
              sampler.options.twirling.shots_per_randomization = 128

              print("Submitting SamplerV2")

              sjob = sampler.run(
                  [isa],
                  shots=8192
              )

              print(
                  "Sampler job:",
                  sjob.job_id()
              )

              sr = sjob.result()[0]

              counts = sr.data.meas.get_counts()

              good = (
                  counts.get("0" * nq, 0)
                  + counts.get("1" * nq, 0)
              )

              ibm["sampler_job"] = sjob.job_id()
              ibm["ghz_success"] = good / 8192


              # ------------------------------------------------------
              # Estimator baseline vs resilience level 2
              # ------------------------------------------------------

              qce = QuantumCircuit(nq)

              qce.h(0)

              for q in range(nq - 1):
                  qce.cx(q, q + 1)

              isa_est = pm.run(qce)

              obs = SparsePauliOp(
                  "Z" * nq
              ).apply_layout(
                  isa_est.layout
              )


              # Level 0
              est0 = EstimatorV2(
                  mode=backend
              )

              est0.options.resilience_level = 0
              est0.options.default_precision = 0.02

              job0 = est0.run([
                  (isa_est, obs)
              ])

              r0 = job0.result()[0]

              ibm["estimator_level0_job"] = (
                  job0.job_id()
              )

              ibm["level0_ev"] = (
                  np.asarray(
                      r0.data.evs
                  ).tolist()
              )


              # Level 2 + ZNE + DD + twirling
              est2 = EstimatorV2(
                  mode=backend
              )

              est2.options.resilience_level = 2

              est2.options.dynamical_decoupling.enable = True
              est2.options.dynamical_decoupling.sequence_type = "XpXm"

              est2.options.twirling.enable_gates = True

              est2.options.resilience.zne_mitigation = True

              est2.options.resilience.zne.noise_factors = (
                  1, 3, 5
              )

              est2.options.resilience.zne.extrapolator = (
                  "exponential",
                  "linear"
              )

              print(
                  "Submitting resilience-level-2 Estimator"
              )

              job2 = est2.run(
                  [(isa_est, obs)],
                  precision=0.02
              )

              r2 = job2.result()[0]

              ibm["estimator_level2_job"] = (
                  job2.job_id()
              )

              ibm["level2_ev"] = (
                  np.asarray(
                      r2.data.evs
                  ).tolist()
              )

              ibm["level2_std"] = (
                  np.asarray(
                      r2.data.stds
                  ).tolist()
              )


              # ------------------------------------------------------
              # OPTIONAL BOUNDED PEC
              # ------------------------------------------------------

              if ENABLE_PEC:

                  print(
                      "Submitting bounded PEC experiment"
                  )

                  pec = EstimatorV2(
                      mode=backend
                  )

                  pec.options.resilience_level = 1

                  pec.options.resilience.pec_mitigation = True

                  # Deliberate cost guard.
                  pec.options.resilience.pec.max_overhead = 10

                  pec.options.twirling.enable_gates = True

                  pjob = pec.run(
                      [(isa_est, obs)],
                      precision=0.05
                  )

                  pr = pjob.result()[0]

                  ibm["pec_job"] = pjob.job_id()

                  ibm["pec_ev"] = (
                      np.asarray(
                          pr.data.evs
                      ).tolist()
                  )

          else:
              print(
                  "IBM token unavailable; QPU tests skipped."
              )

          raw["ibm"] = ibm


          # ==========================================================
          # E9 QISKIT CAPABILITY SCORE
          # ==========================================================

          qiskit_score = {
              "aer_scaling_completed":
                  len(aer_rows) == 5,
              "ibm_connected":
                  bool(ibm.get("selected_backend")),
              "sampler_v2_completed":
                  bool(ibm.get("sampler_job")),
              "estimator_raw_completed":
                  bool(ibm.get("estimator_level0_job")),
              "estimator_resilient_completed":
                  bool(ibm.get("estimator_level2_job")),
              "pec_completed":
                  bool(ibm.get("pec_job"))
          }

          qiskit_score["score"] = sum(
              bool(v)
              for k, v in qiskit_score.items()
              if k != "score"
          )

          raw["qiskit_capability"] = qiskit_score


          # ==========================================================
          # E10 T3 BEN
